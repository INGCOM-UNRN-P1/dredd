[project]
name = "dredd"
version = "2.1.0"
description = "Multi-channel batch autograder and submission manager for C programming courses (GitHub Classroom & Moodle)"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "Martín René Vilugrón", email = "martinvilu@gmail.com"}
]
maintainers = [
    {name = "Programación I [B6003] - UNRN Andina"}
]
requires-python = ">=3.11"
keywords = ["education", "c-programming", "pedagogical-tools", "unrn"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "jinja2>=3.1.3",
    "python-slugify>=8.0.4",
    "pyyaml>=6.0.3",
    "tree-sitter>=0.23.0",
    "tree-sitter-c>=0.23.0",
    # Núcleo común del ecosistema (N-ECO-14): TyperConErrores y textos en español.
    "yutani @ git+https://github.com/INGCOM-UNRN-P1/yutani@e4c8e1050e5dd87a930c5404aba6b65d1be1665a",
]

[project.optional-dependencies]
# Herramientas del ecosistema que se usan como biblioteca (N-ECO-01). Referencias git fijadas
# a commits publicados; sin el extra se usa el camino propio (gcc, sin sandbox de nostromo…).
ecosistema = [
    "daedalus @ git+https://github.com/INGCOM-UNRN-P1/daedalus@cd3eb998193cd5bd9ea881aa9a0e19f5fe6d9a86",
    "nostromo @ git+https://github.com/INGCOM-UNRN-P1/nostromo@30e2743ca7bb88673283edbc8eb7419e8a1e9ca0",
    "gaff @ git+https://github.com/INGCOM-UNRN-P1/gaff@64aa958f6b834e013c4d5254b75f0883e475b84f",
    "spunkmeyer @ git+https://github.com/INGCOM-UNRN-P1/spunkmeyer@ec9cbd266f9d187c787f528997f1ae0c09dd8ff2",
]

# Multiplexado de trabajos prácticos con las guías de deckard.
guias = [
    "deckard @ git+https://github.com/INGCOM-UNRN/deckard@cf3c64ace2a9cfae1d758ceb674ca2bb4b0995af",
]

[project.urls]
Homepage = "https://github.com/INGCOM-UNRN-P1/dredd"
Repository = "https://github.com/INGCOM-UNRN-P1/dredd.git"
Issues = "https://github.com/INGCOM-UNRN-P1/dredd/issues"

[project.scripts]
dredd = "dredd.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dredd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
]

[tool.hatch.metadata]
# Las dependencias del ecosistema son referencias directas a git (nunca por nombre en PyPI).
allow-direct-references = true
