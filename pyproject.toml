[project]
name = "dredd"
version = "2.1.0"
description = "Multi-channel batch autograder and submission manager for C programming courses (GitHub Classroom & Moodle)"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "Martín René Vilugrón", email = "martinvilu@gmail.com"}
]
maintainers = [
    {name = "Programación I [B6003] - UNRN Andina"}
]
requires-python = ">=3.11"
keywords = ["education", "c-programming", "pedagogical-tools", "unrn"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "jinja2>=3.1.3",
    "python-slugify>=8.0.4",
    "pyyaml>=6.0.3",
    "tree-sitter>=0.23.0",
    "tree-sitter-c>=0.23.0",
    # Núcleo común del ecosistema (N-ECO-14): TyperConErrores y textos en español.
    "yutani @ git+https://github.com/INGCOM-UNRN-P1/yutani@cf49348fae40d264006fe07dee2cc9e88dd9c934",
]

[project.optional-dependencies]
# Herramientas del ecosistema que se usan como biblioteca (N-ECO-01). Referencias git fijadas
# a commits publicados; sin el extra se usa el camino propio (gcc, sin sandbox de nostromo…).
ecosistema = [
    "daedalus @ git+https://github.com/INGCOM-UNRN-P1/daedalus@18f9c3b3527d16d152d56e918160bc772ac9990c",
    "nostromo @ git+https://github.com/INGCOM-UNRN-P1/nostromo@c4c3bfcfdf709de9f3892e503ae2f208bf166f51",
    "gaff @ git+https://github.com/INGCOM-UNRN-P1/gaff@ec1d82aef96391d3cdc0c7552da6f8f4a513c6ce",
    "spunkmeyer @ git+https://github.com/INGCOM-UNRN-P1/spunkmeyer@b70c5f6ba9fa7cf6b63793a7302ec0284ba825fe",
    "drake @ git+https://github.com/INGCOM-UNRN-P1/drake@6b28fd6748cf879e537fadf0c8d398b6dfd4d0e4",
    "wierzbowski @ git+https://github.com/INGCOM-UNRN-P1/wierzbowski@e7826a18e421b73edb9a54353736251f66f1fa7c",
]

# Multiplexado de trabajos prácticos con las guías de deckard.
guias = [
    "deckard @ git+https://github.com/INGCOM-UNRN/deckard@2f36e12692c98ef4970cc40c5396dd1635ad14d0",
]

[project.urls]
Homepage = "https://github.com/INGCOM-UNRN-P1/dredd"
Repository = "https://github.com/INGCOM-UNRN-P1/dredd.git"
Issues = "https://github.com/INGCOM-UNRN-P1/dredd/issues"

[project.scripts]
dredd = "dredd.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dredd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
]

[tool.hatch.metadata]
# Las dependencias del ecosistema son referencias directas a git (nunca por nombre en PyPI).
allow-direct-references = true

[tool.mypy]
# Tipos del paquete (N-ECO-08): `uv run --with mypy mypy`, igual que el CI.
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
