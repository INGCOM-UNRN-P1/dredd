[project]
name = "dredd"
version = "2.1.0"
description = "Multi-channel batch autograder and submission manager for C programming courses (GitHub Classroom & Moodle)"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "Martín René Vilugrón", email = "martinvilu@gmail.com"}
]
maintainers = [
    {name = "Programación I [B6003] - UNRN Andina"}
]
requires-python = ">=3.11"
keywords = ["education", "c-programming", "pedagogical-tools", "unrn"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "jinja2>=3.1.3",
    "python-slugify>=8.0.4",
    "pyyaml>=6.0.3",
    "tree-sitter>=0.23.0",
    "tree-sitter-c>=0.23.0",
    # Núcleo común del ecosistema (N-ECO-14): TyperConErrores y textos en español.
    "yutani @ git+https://github.com/INGCOM-UNRN-P1/yutani@31f79c904ac33065cc1c2b9fd34b4c513f0028d9",
]

[project.optional-dependencies]
# Herramientas del ecosistema que se usan como biblioteca (N-ECO-01). Referencias git fijadas
# a commits publicados; sin el extra se usa el camino propio (gcc, sin sandbox de nostromo…).
ecosistema = [
    "daedalus @ git+https://github.com/INGCOM-UNRN-P1/daedalus@9cefe644353851858f2e77b7936ed34ae1c510ea",
    "nostromo @ git+https://github.com/INGCOM-UNRN-P1/nostromo@ec62a77c6452750df644b78382e0ec6fb12a0f00",
    "gaff @ git+https://github.com/INGCOM-UNRN-P1/gaff@9f29161905bcf5a5cdfaf057d0d265e4221518a2",
    "spunkmeyer @ git+https://github.com/INGCOM-UNRN-P1/spunkmeyer@e89e4143bd43e4d626a3521125585dde4a3809a2",
]

# Multiplexado de trabajos prácticos con las guías de deckard.
guias = [
    "deckard @ git+https://github.com/INGCOM-UNRN/deckard@5566e32988e073e03eb75e0d1a2a9dca76c4d8c8",
]

[project.urls]
Homepage = "https://github.com/INGCOM-UNRN-P1/dredd"
Repository = "https://github.com/INGCOM-UNRN-P1/dredd.git"
Issues = "https://github.com/INGCOM-UNRN-P1/dredd/issues"

[project.scripts]
dredd = "dredd.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dredd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
]

[tool.hatch.metadata]
# Las dependencias del ecosistema son referencias directas a git (nunca por nombre en PyPI).
allow-direct-references = true
