[project]
name = "dredd"
version = "2.0.0"
description = "Multi-channel batch autograder and submission manager for C programming courses (GitHub Classroom & Moodle)"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "Martín René Vilugrón", email = "martinvilu@gmail.com"}
]
maintainers = [
    {name = "Programación I [B6003] - UNRN Andina"}
]
requires-python = ">=3.11"
keywords = ["education", "c-programming", "pedagogical-tools", "unrn"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "jinja2>=3.1.3",
    "python-slugify>=8.0.4",
    "pyyaml>=6.0.3",
    "tree-sitter>=0.23.0",
    "tree-sitter-c>=0.23.0",
]

[project.urls]
Homepage = "https://github.com/INGCOM-UNRN-P1/dredd"
Repository = "https://github.com/INGCOM-UNRN-P1/dredd.git"
Issues = "https://github.com/INGCOM-UNRN-P1/dredd/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
]

[project.scripts]
dredd = "dredd.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dredd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]