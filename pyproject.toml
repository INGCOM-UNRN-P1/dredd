[project]
name = "dredd"
version = "2.0.0"
description = "Multi-channel batch autograder and submission manager for C programming courses (GitHub Classroom & Moodle)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "jinja2>=3.1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
]

[project.scripts]
dredd = "dredd.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dredd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
